<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Pastel floating orbs">
  <defs>
    <radialGradient id="coral" cx="34%" cy="25%" r="78%"><stop stop-color="#ffd0bc"/><stop offset=".45" stop-color="#ff9878"/><stop offset="1" stop-color="#ed593f"/></radialGradient>
    <radialGradient id="blue" cx="34%" cy="25%" r="78%"><stop stop-color="#d9f5ff"/><stop offset=".48" stop-color="#83d1ef"/><stop offset="1" stop-color="#3a9bc1"/></radialGradient>
    <radialGradient id="amber" cx="34%" cy="25%" r="78%"><stop stop-color="#fff0c5"/><stop offset=".48" stop-color="#ffd078"/><stop offset="1" stop-color="#e89a28"/></radialGradient>
    <radialGradient id="violet" cx="34%" cy="25%" r="78%"><stop stop-color="#f0eaff"/><stop offset=".48" stop-color="#bda9e8"/><stop offset="1" stop-color="#7659af"/></radialGradient>
